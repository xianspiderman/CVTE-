server:
  address: 127.0.0.1
  port: ${BACKEND_PORT:8080}
spring:
  application:
    name: scm-workbench
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:scm_workbench}?connectionTimeZone=Asia/Shanghai&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    time-zone: Asia/Shanghai
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
scm:
  ai:
    base-url: ${SCM_AI_BASE_URL:}
    api-key: ${SCM_AI_API_KEY:}
    model: ${SCM_AI_MODEL:gpt-6.1-sol}
  fixed-now: ${SCM_FIXED_NOW:}
  mock-port: ${MOCK_PORT:4010}
  mock-url: http://127.0.0.1:${MOCK_PORT:4010}
  # Business time is fixed only when explicitly configured for repeatable acceptance.

mybatis:
  configuration:
    map-underscore-to-camel-case: true
